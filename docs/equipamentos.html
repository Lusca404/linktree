<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Equipamentos | Seu Nome</title>
	<style>
		:root { --bg: #f5f2ed; --ink: #171717; --card: #fffdf9; --accent: #ff795f; }
		* { box-sizing: border-box; }
		body { margin: 0; min-height: 100vh; color: var(--ink); font-family: Arial, Helvetica, sans-serif; background: radial-gradient(circle at 10% 10%, #ffd9c7 0 13%, transparent 32%), radial-gradient(circle at 90% 90%, #d9e8df 0 10%, transparent 30%), var(--bg); }
		main { width: min(100% - 32px, 620px); margin: auto; padding: 48px 0 28px; text-align: center; }
		.avatar { width: 104px; height: 104px; display: block; margin: 0 auto 18px; border: 4px solid var(--ink); border-radius: 50%; background: var(--accent); object-fit: cover; box-shadow: 5px 5px 0 var(--ink); }
		h1 { margin: 0; font-size: clamp(28px, 7vw, 42px); letter-spacing: -1.5px; }
		.bio { margin: 10px auto 28px; max-width: 420px; line-height: 1.5; color: #555; }
		.links { display: grid; gap: 14px; }
		.link { display: flex; align-items: center; justify-content: center; min-height: 62px; padding: 14px 52px; position: relative; color: var(--ink); background: var(--card); border: 2px solid var(--ink); border-radius: 16px; font-size: 16px; font-weight: 700; text-decoration: none; box-shadow: 4px 4px 0 var(--ink); transition: transform .18s, box-shadow .18s, background .18s; }
		.link:hover { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); background: #fff0e8; }
		.icon { position: absolute; left: 19px; font-size: 22px; }
		.back { display: inline-block; margin-top: 28px; color: var(--ink); font-size: 14px; font-weight: 700; }
		@media (max-width: 420px) { main { padding-top: 30px; } .link { min-height: 58px; } }
	</style>
</head>
<body>
	<main>
		<img class="avatar" src="https://instagram.fbel12-1.fna.fbcdn.net/v/t51.82787-19/762107984_17973832542066267_3375986969172319351_n.jpg?_nc_cat=108&amp;ccb=7-5&amp;_nc_sid=bf7eb4&amp;efg=eyJ2ZW5jb2RlX3RhZyI6InByb2ZpbGVfcGljLnd3dy43OTIuQzMifQ%3D%3D&amp;_nc_ohc=s34Umkl0z5MQ7kNvwGwE8S3&amp;_nc_oc=AdoI4ZEZOnomuAaNm7RArw2-D2PUKz7SmkKbASGShNP6gHasXHQ_eSv1zdlb-ZtHzzXRe4VHfHC18Qzo9XbUJnsr&amp;_nc_zt=24&amp;_nc_ht=instagram.fbel12-1.fna&amp;_nc_gid=b9I5IQHtxjFj74mlk56LPA&amp;_nc_ss=7b2a8&amp;oh=00_AQKNorKudbj6Z6V2j_3ogJcT-tcmY4rAcXGKozGWerWu2A&amp;oe=6ABA0C4A" alt="Foto de perfil de Dival Lucas">
		<h1>Em reforma</h1>
		<p class="bio">A página dos meus equipamentos está sendo preparada. Volte em breve!</p>
		<a class="back" href="index.html">← Voltar para todos os links</a>
	</main>
</body>
</html>
